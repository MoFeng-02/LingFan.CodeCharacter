<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LingFan CodeCharacter · v0 头像切片冒烟</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #101418;
        color: #d8dee6;
      }
      canvas {
        border: 1px solid #2a323c;
        border-radius: 12px;
        background: #14181e;
      }
      #panel {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 28px;
        max-width: 640px;
        padding: 12px 20px;
        border: 1px solid #2a323c;
        border-radius: 12px;
        font-size: 13px;
      }
      #panel label {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #panel input[type="range"] {
        width: 110px;
      }
      #expressions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: center;
      }
      #expressions button,
      #modes button {
        font-size: 13px;
        padding: 4px 14px;
        border-radius: 8px;
        border: 1px solid #2a323c;
        background: #1c232c;
        color: #d8dee6;
        cursor: pointer;
      }
      #expressions button.active,
      #modes button.active {
        border-color: #5b8fd9;
        color: #ffffff;
      }
      .hidden {
        display: none !important;
      }
      #panel-portrait {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 28px;
        max-width: 640px;
        padding: 12px 20px;
        border: 1px solid #2a323c;
        border-radius: 12px;
        font-size: 13px;
      }
      #panel-portrait label {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #panel-portrait input[type="range"] {
        width: 110px;
      }
    </style>
  </head>
  <body>
    <main style="display: contents">
      <section id="modes">
        <button type="button" data-mode="humanoid" class="active">程序角色</button>
        <button type="button" data-mode="portrait">素材立绘</button>
      </section>
      <canvas id="stage" width="512" height="512"></canvas>
      <section id="panel">
        <label>转头
          <input type="range" min="-1" max="1" step="0.01" value="0"
                 data-param="humanoid.params.turn" />
        </label>
        <label>微笑
          <input type="range" min="0" max="1" step="0.01" value="0.2"
                 data-param="humanoid.params.smile" />
        </label>
        <label>眨眼
          <input type="range" min="0" max="1" step="0.01" value="0"
                 data-param="humanoid.params.blink" />
        </label>
        <label>呼吸
          <input type="range" min="0" max="1" step="0.01" value="0.35"
                 data-param="humanoid.params.breath" />
        </label>
        <label>发摆
          <input type="range" min="-1" max="1" step="0.01" value="0"
                 data-param="humanoid.params.swing" />
        </label>
        <label>风
          <input type="range" min="0" max="1" step="0.01" value="0"
                 data-param="humanoid.params.wind" />
        </label>
        <label>视线横
          <input type="range" min="-1" max="1" step="0.01" value="0"
                 data-param="humanoid.face.gaze-x" />
        </label>
        <label>视线竖
          <input type="range" min="-1" max="1" step="0.01" value="0"
                 data-param="humanoid.face.gaze-y" />
        </label>
        <label>下颌
          <input type="range" min="0" max="1" step="0.01" value="0"
                 data-param="humanoid.mouth.jaw-open" />
        </label>
        <label>睁眼
          <input type="range" min="0" max="1" step="0.01" value="0.5"
                 data-param="humanoid.face.eye-open-l" />
        </label>
        <button id="speak" type="button"
                style="font-size: 13px; padding: 4px 14px; border-radius: 8px;
                       border: 1px solid #2a323c; background: #1c232c; color: #d8dee6;">
          开始说话
        </button>
        <label style="font-size: 12px; color: #8a94a3;">音频文件
          <input type="file" id="audio-file" accept="audio/*"
                 style="font-size: 12px; max-width: 160px;" />
        </label>
        <button id="audio-play" type="button" disabled
                style="font-size: 13px; padding: 4px 14px; border-radius: 8px;
                       border: 1px solid #2a323c; background: #1c232c; color: #d8dee6;">
          播放音频
        </button>
      </section>
      <section id="expressions">
        <button type="button" data-expression="惊讶">惊讶</button>
        <button type="button" data-expression="将笑未笑">将笑未笑</button>
        <button type="button" data-expression="皱眉">皱眉</button>
        <button type="button" data-expression="单挑眉">单挑眉</button>
        <button type="button" class="reset">复位表情</button>
      </section>
      <section id="panel-portrait" class="hidden">
        <label>呼吸
          <input type="range" min="0" max="1" step="0.01" value="0.4"
                 data-param="portrait.params.breathe" />
        </label>
        <label>眨眼
          <input type="range" min="0" max="1" step="0.01" value="0"
                 data-param="portrait.params.blink" />
        </label>
        <label>口型
          <input type="range" min="0" max="1" step="0.01" value="0"
                 data-param="portrait.params.mouth-open" />
        </label>
        <label>朝向
          <input type="range" min="-1" max="1" step="0.01" value="0"
                 data-param="portrait.params.head-turn" />
        </label>
        <label style="font-size: 12px; color: #8a94a3;">立绘图片
          <input type="file" id="portrait-file" accept="image/*"
                 style="font-size: 12px; max-width: 160px;" />
        </label>
      </section>
    </main>
    <output id="status" aria-live="polite"></output>
    <script src="./out/main.js"></script>
  </body>
</html>
